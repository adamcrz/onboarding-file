# Render Blueprint — one Node service serving both the API and the frontend,
# backed by MongoDB Atlas.
#
# GitHub cannot host this: Pages serves static files only, and this is a
# long-running Node server holding a database connection. Render runs it from
# the same repository, on a push.
#
# The app lives in onboarding-app/ inside the repo, which is why every path
# below is prefixed with it.
#
# MONGO_URI and JWT_SECRET are deliberately absent and set in the dashboard,
# because this file is committed. Both are marked `sync: false`, which makes
# Render prompt for them on the first deploy.
services:
  - type: web
    name: onboarding-app
    runtime: node
    # No disk, and none needed. Uploaded files live in the database (GridFS),
    # and the uploads folder is only a cache that refills itself from there on
    # first access — so an instance that is rebuilt, restarted or moved loses
    # nothing. That is what makes the free plan viable here; it was not before
    # the files went into the database.
    #
    # Free instances sleep after ~15 minutes idle and take up to a minute to
    # wake. Change to `starter` (about $7/month) if that wait is not wanted.
    plan: free
    region: frankfurt      # closest to Switzerland — keep the Atlas cluster here too
    healthCheckPath: /api/health

    buildCommand: npm --prefix onboarding-app/backend ci --omit=dev
    startCommand: npm --prefix onboarding-app/backend start

    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production      # HSTS, secure cookies, strict rate limits, no demo users
      - key: DOCUMENT_AUTO_VERIFY
        value: "false"         # keep off: turning it on requires Chromium in the image
      - key: ALLOW_DATABASE_RESET
        value: "false"         # the server refuses to start in production if this is true
      # Playwright backs the contract-validation path, which is off by default.
      # Without this the build downloads ~400MB of browsers it would never use.
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
      # ARCHIVE_DIR is deliberately unset here. The archive is a OneDrive-synced
      # SharePoint library, which exists on the office machines and not in a
      # container. Files therefore stay in the database on this instance, and
      # the archiving and release steps are the local installs' job.

      # Set these in the Render dashboard, never in this file.
      - key: MONGO_URI
        sync: false            # the Atlas connection string, password included
      - key: JWT_SECRET
        sync: false            # 48+ random bytes; the server refuses to start on a weak one

      # The service's own public URL, e.g. https://onboarding-app.onrender.com.
      # Not known until the first deploy finishes, so fill it in afterwards and
      # redeploy. ALLOWED_ORIGINS can stay unset: the app serves its own pages,
      # and same-origin requests are always accepted.
      - key: FRONTEND_URL
        sync: false
