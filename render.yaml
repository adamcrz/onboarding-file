# Render Blueprint — one Node service serving both the API and the frontend,
# backed by MongoDB Atlas.
#
# Point Render at this repository ("New → Blueprint") and it reads this file.
# The app lives in onboarding-app/ inside the repo, which is why every path
# below is prefixed with it.
#
# Two values are deliberately absent and are set in the dashboard instead,
# because this file is committed: MONGO_URI and JWT_SECRET. Both are marked
# `sync: false`, which makes Render prompt for them on the first deploy.
services:
  - type: web
    name: onboarding-app
    runtime: node
    plan: starter          # the disk below needs a paid instance; the free tier has no persistent storage
    region: frankfurt      # closest to Switzerland — put the Atlas cluster in the same region
    healthCheckPath: /api/health

    buildCommand: npm --prefix onboarding-app/backend ci --omit=dev
    startCommand: npm --prefix onboarding-app/backend start

    # Uploaded contracts and supporting documents are written to the filesystem,
    # not into MongoDB. Without a disk they sit in the container's ephemeral
    # storage and every deploy destroys them silently. UPLOADS_DIR below points
    # the app at this mount.
    disk:
      name: uploads
      mountPath: /var/data/uploads
      sizeGB: 1

    envVars:
      - key: NODE_VERSION
        value: "20"            # package.json pins engines to >=20 <21
      - key: NODE_ENV
        value: production      # HSTS, secure cookies, strict rate limits, no demo users
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: DOCUMENT_AUTO_VERIFY
        value: "false"         # keep off: turning it on requires Chromium in the image
      - key: ALLOW_DATABASE_RESET
        value: "false"         # the server refuses to start in production if this is true
      # Playwright backs the contract-validation path, which is off by default.
      # Without this the build downloads ~400MB of browsers it would never use.
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"

      # Set these in the Render dashboard, never in this file.
      - key: MONGO_URI
        sync: false            # the Atlas connection string, password included
      - key: JWT_SECRET
        sync: false            # 48+ random bytes; the server refuses to start on a weak one

      # Both are the service's own public URL, e.g.
      # https://onboarding-app.onrender.com — not known until the first deploy
      # finishes, so fill them in afterwards and redeploy.
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
