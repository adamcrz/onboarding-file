# Builds and deploys the app to Azure App Service on every push to main.
#
# Two things about this repository shape drive the config below:
#   1. The app lives in a nested folder (onboarding-app/), not at the repo root.
#   2. The server is in backend/ but serves the SPA from ../frontend, so BOTH
#      folders have to travel together or the site returns 404 for every page.
# The package therefore has onboarding-app/ as its root, and App Service is
# started with "node backend/server.js" from there.
name: Deploy to Azure App Service

# INACTIVE. Deployment goes through Render (see render.yaml and
# onboarding-app/backend/DEPLOYMENT.md), so this no longer runs on push — it
# would fail every time, because AZURE_WEBAPP_NAME below was never filled in
# and the publish-profile secret does not exist. Kept as a working starting
# point if Azure App Service is ever preferred: set the name, add the secret,
# and restore the `push:` trigger.
on:
  workflow_dispatch:        # hand-triggered only, from the Actions tab

env:
  AZURE_WEBAPP_NAME: CHANGE-ME          # the App Service name you created
  APP_ROOT: onboarding-app              # folder holding backend/ and frontend/
  NODE_VERSION: '20.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install production dependencies
        working-directory: ${{ env.APP_ROOT }}/backend
        # Chromium is only used by the automatic signature checker, which is
        # currently switched off, and it is loaded lazily — so skipping the
        # ~150MB browser download keeps deploys fast. Remove this line if you
        # turn DOCUMENT_AUTO_VERIFY back on.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --omit=dev

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.APP_ROOT }}
