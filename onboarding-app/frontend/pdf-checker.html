<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>PDF checker harness</title></head>
<body>

  Not a user-facing page — this is the harness the backend's Playwright-driven
  document checker (backend/services/pdfChecker.service.js) navigates a
